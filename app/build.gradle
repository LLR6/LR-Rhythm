plugins { id 'com.android.application' }
android {
    namespace 'com.lr.rhythm'
    compileSdk 35
    defaultConfig { applicationId 'com.lr.rhythm'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (System.getenv('LR_KEYSTORE_PATH')) {
                signingConfigs.create('lrRelease') {
                    storeFile file(System.getenv('LR_KEYSTORE_PATH'))
                    storePassword System.getenv('LR_KEYSTORE_PASSWORD')
                    keyAlias System.getenv('LR_KEY_ALIAS')
                    keyPassword System.getenv('LR_KEY_PASSWORD')
                }
                signingConfig signingConfigs.lrRelease
            }
        }
    }
}
